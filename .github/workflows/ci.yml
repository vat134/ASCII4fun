name: ci

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  checks:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
          cache: pnpm

      - run: pnpm install --frozen-lockfile
      - run: pnpm check:http-contracts
      - name: Install Cypress binary
        run: pnpm exec cypress install
      - run: pnpm format
      - run: pnpm lint
      - run: pnpm typecheck
      - run: pnpm test:tools
      - run: pnpm test:web
      - name: Install video codecs
        run: sudo apt-get update && sudo apt-get install --yes ffmpeg
      - run: dotnet workload install wasm-tools
      - run: pnpm build:web
      - run: dotnet restore ascii4fun.slnx
      - run: dotnet format ascii4fun.slnx --verify-no-changes --no-restore
      - run: dotnet format src/engine/browser/ascii4fun-browser.csproj --verify-no-changes --no-restore
      - run: dotnet build ascii4fun.slnx --configuration Release --no-restore
      - name: Run .NET tests
        timeout-minutes: 5
        run: >-
          dotnet test ascii4fun.slnx --configuration Release --no-build
          --logger "console;verbosity=normal" --logger trx
          --blame-hang-timeout 2m --blame-hang-dump-type mini
          --results-directory artifacts/test-results
      - name: Upload .NET test diagnostics
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: dotnet-test-diagnostics
          path: artifacts/test-results
          if-no-files-found: ignore
          retention-days: 3
      - run: node tools/test-package.mjs
      - run: pnpm test:e2e

  engine-platforms:
    strategy:
      matrix:
        os: [windows-latest, macos-latest]

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: global.json

      - name: Install Windows video codecs
        if: runner.os == 'Windows'
        run: choco install ffmpeg --yes --no-progress
      - name: Install macOS video codecs
        if: runner.os == 'macOS'
        run: brew install ffmpeg
      - run: dotnet restore tests/ascii4fun-tests/ascii4fun-tests.csproj
      - run: dotnet test tests/ascii4fun-tests/ascii4fun-tests.csproj --configuration Release --no-restore
      - uses: actions/setup-node@v7
        with:
          node-version: 22.x
      - run: node tools/test-package.mjs
